*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;font-size:15px}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:2500;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:10px 0;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.01em}
.dlg.in-r{animation:inR .18s ease-out}.dlg.in-l{animation:inL .18s ease-out}@keyframes inR{from{transform:translateX(40px);opacity:.3}}@keyframes inL{from{transform:translateX(-40px);opacity:.3}}

.brand .app{padding-left:12px;border-left:1px solid var(--line);color:var(--muted);font-weight:600;font-size:18px;line-height:22px}
@media (max-width:640px){.logo{height:17px}.brand .app{font-size:16px;padding-left:10px}}
.save{font-size:12px;color:var(--muted);margin-left:auto;display:flex;align-items:center;gap:6px}
.save i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.save.cloud i{background:var(--ok)} .save.busy i{background:var(--soon)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;width:100%;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs .gear{margin-left:auto;display:inline-flex;align-items:center;padding:6px 10px 7px}
nav.tabs .ring{display:block;width:26px;height:26px;fill:none;stroke:var(--brand);stroke-width:4}
nav.tabs button.home{display:flex;align-items:center;justify-content:center}
@media (max-width:640px){nav.tabs button.home{padding:0 2px;border-top:0;justify-content:flex-start;overflow:visible}nav.tabs .ring{width:60px;height:60px;margin-top:-10px;padding:4px;background:var(--surface);border-radius:50%;flex:none}nav.tabs button.home{position:relative}nav.tabs button.home::before{content:"";position:absolute;left:50%;top:-11px;width:62px;height:62px;transform:translateX(-50%);border-radius:50%;border:1px solid var(--line);box-sizing:border-box;clip-path:inset(0 0 calc(100% - 12px) 0);pointer-events:none;z-index:1}nav.tabs button.home[aria-selected="true"]::before{border:3px solid var(--accent);top:-11px;clip-path:inset(0 0 calc(100% - 14px) 0)}}
nav.tabs .ti{display:none;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
html{-webkit-text-size-adjust:100%}
main{overflow-x:clip}
@media (max-width:640px){
  input,select,textarea{font-size:16px!important}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:2000;background:var(--surface);border-top:1px solid var(--line);gap:0;padding:0 max(4px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(4px,env(safe-area-inset-left,0px));overflow:visible;box-shadow:0 -2px 10px rgba(16,30,48,.06)}
  nav.tabs button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border-bottom:0;border-top:3px solid transparent;font-size:11px;font-family:var(--f-body)}
  nav.tabs button[aria-selected="true"]{border-top-color:var(--accent);color:var(--accent)}
  nav.tabs .ti{display:block}
  nav.tabs .tl{font-size:0;position:relative;white-space:nowrap}
  nav.tabs .tl::before{content:attr(data-s);font-size:11px;font-weight:600}
  nav.tabs .tl .cnt{position:absolute;top:-30px;left:50%;margin-left:4px;font-size:10px;min-width:16px;padding:0 4px}
  nav.tabs .gear{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));flex:none;border-top:0;padding:6px;background:var(--surface);color:var(--muted)}
  nav.tabs .gear[aria-selected="true"]{color:var(--accent)}
  .topin{padding-bottom:10px;padding-right:56px}
  main{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .cnt{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;font-size:12px;font-family:var(--f-body);font-weight:600;background:var(--over-soft);color:var(--over)}

main{max-width:1400px;margin:0 auto;padding-block:18px 60px}
h2{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0}
.lbl{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;line-height:1.2;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{color:var(--over);border-color:var(--over)}
.btn.okb{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.sm{padding:4px 9px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:default}
input[type=text],input[type=tel],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0}
textarea{width:100%;min-height:60px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-over{background:var(--over-soft);color:var(--over)} .p-soon{background:var(--soon-soft);color:var(--soon)} .p-ok{background:var(--ok-soft);color:var(--ok)}
.p-none{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line)}
.p-plan{background:var(--accent-soft);color:var(--accent)} .p-priv{background:var(--priv-soft);color:var(--priv)} .p-grey{background:var(--surface-2);color:var(--muted)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--accent-soft);margin-bottom:14px;font-size:14px}
.banner.warnb{background:var(--soon-soft)}

/* Übersicht (Dashboard) */
.dhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.dash{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.tiles{display:flex;flex-direction:column;gap:16px}
.brief{padding:12px 18px 16px;display:flex;flex-direction:column;gap:14px}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bhead h2{margin:0;line-height:1.15}
.lrow3{flex-wrap:nowrap;gap:6px}.lrow3>.btn{flex:1 1 auto;justify-content:center;text-align:center;white-space:nowrap;padding-left:8px;padding-right:8px;min-width:0}
@media (max-width:640px){.brief{padding:10px 14px 14px}.brief .today{padding:12px}.lrow3>.btn{font-size:13px}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;min-width:0}
.kpi .big{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1;margin:2px 0}
.kpi .big small{font-size:15px;font-weight:600;color:var(--muted)}
.kpi .muted{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.firstc{border-left:3px solid var(--accent);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:6px}
.firstc h3{font-size:19px}
.stops{display:flex;flex-direction:column}

<script>
"use strict";
const APPVER="2026-11-02 15:30";
/* ---------- Hilfen ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pISO=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=pISO(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>{const A=a.split("-").map(Number),B=b.split("-").map(Number);return Math.round((Date.UTC(B[0],B[1]-1,B[2])-Date.UTC(A[0],A[1]-1,A[2]))/864e5)};
const dow=s=>pISO(s).getDay();
const toMin=s=>{const[h,m]=String(s||"0:0").split(":").map(Number);return h*60+(m||0)};
const hm=m=>pad(Math.floor(m/60))+":"+pad(Math.round(m%60));
const DOW=["So","Mo","Di","Mi","Do","Fr","Sa"];
const fmtD=s=>s?DOW[dow(s)]+" "+s.slice(8,10)+"."+s.slice(5,7)+".":"–";
const fmtDY=s=>s?s.slice(8,10)+"."+s.slice(5,7)+"."+s.slice(0,4):"–";
const todayISO=()=>iso(new Date());
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const mondayOf=s=>addDays(s,-((dow(s)+6)%7));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const num=v=>{if(v===null||v===undefined||v==="")return null;if(typeof v==="number")return isFinite(v)?v:null;const n=parseFloat(String(v).trim().replace(/\s/g,"").replace(",","."));return isFinite(n)?n:null};
const up5=m=>Math.ceil(m/5)*5;
const clone=o=>JSON.parse(JSON.stringify(o));
function toast(msg){$$(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ---------- Zustand ---------- */
const DEF={ver:5,ttKey:"",briefMin:5,notesMin:10,travelPct:10,earliestVisit:"07:30",maxVisitsNear:6,home:{label:"Zuhause",address:"",lat:null,lng:null},speed:60,roadFactor:1.3,overhead:0,clusterMin:20,
  travelDays:[1,2,3,4],dayStart:"06:00",dayEnd:"17:00",lunchFrom:"11:45",lunchTo:"13:30",lunchMin:60,minTravelH:8,minTravelFriH:4,maxVisits:5,
  horizonWeeks:4,pullForward:7,defInterval:60,defDuration:45,dueX:14,freeDays:"24.12., 31.12.",custTypes:["Verarbeiter","Verarbeiter-Filiale","Großhandel","Abholmarkt","Planungsbüro","Bauträger","Fachberufsschule"],prodGroups:["Hausabfluss (POLO-KAL)","Kanal","Wohnraumlüftung (POLO-KWL)","Installationselemente (POLO-BOX)"],visitTopics:["POLO-KAL (Abwasser-Auslegung)","POLO-KWL (Wohnraumlüftung)","POLO-BOX (Installationselemente)","Angebot / Projekt","Reklamation","Produktneuheit","Preise / Konditionen","Schulung / Veranstaltung"],docTypes:["PL 2026","KWL Folder","POLO-KAL Folder","Weihnachtskampagne 2026"],vacationDays:25,sample:false,
  cap:{perWeek:4,perDay:4.5,customers:250,withVacation:false}};
const S={settings:clone(DEF),customers:[],appts:[],days:{},events:[],team:[],todos:[]};
function migrate(s){const o=Object.assign(clone(DEF),s||{});o.cap=Object.assign(clone(DEF.cap),o.cap||{});
  if(!s||!s.ver||s.ver<2){Object.assign(o,{travelDays:[1,2,3,4],dayStart:"07:00",dayEnd:"17:00",lunchFrom:"11:45",lunchTo:"13:30",lunchMin:60,defDuration:60,maxVisits:6});delete o.workdays;delete o.lunchStart}
  if(!s||!s.ver||s.ver<3){if(!s||!s.ver||s.ver<2||o.defInterval===101)o.defInterval=60}
  if(!s||!s.ver||s.ver<4){o.dayStart="06:00";o.maxVisits=5}
  if(s&&Array.isArray(s.custTypes)&&s.custTypes.includes("GH-Außendienst")){o.custTypes=s.custTypes.filter(x=>x!=="GH-Außendienst");if(!o.custTypes.includes("Verarbeiter-Filiale"))o.custTypes.splice(1,0,"Verarbeiter-Filiale");o._migrated=true}
  if(!s||!s.ver||s.ver<5){Object.assign(o,{briefMin:5,notesMin:10,travelPct:10,overhead:0,defDuration:45});o.ver=5;o._migrated=!!s}
  return o}
const ui={csel:new Set(),showActive:(()=>{try{return localStorage.getItem("tp.showActive")!=="0"}catch(e){return true}})(),showInactive:(()=>{try{return localStorage.getItem("tp.showInactive")!=="0"}catch(e){return true}})(),tab:"overview",regFilter:(()=>{try{return localStorage.getItem("tp.reg")||""}catch(e){return""}})(),week:mondayOf(todayISO()),filter:"all",search:"",mapDay:"",sel:null,custFilter:"all",sort:"due"};

/* ---------- Speicherung: Konto (db) mit lokalem Zwischenspeicher ---------- */
const store={db:null,uid:null,refs:{},timers:{},busy:{},again:{},pending:{},loaded:{}};
const KEYS=["settings","customers","appts","days","events","team","todos"];
function lsGet(k){try{const v=localStorage.getItem("tp."+k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem("tp."+k,JSON.stringify(v))}catch(e){}}
function loadLocal(){const s=lsGet("settings");if(s){S.settings=migrate(s);if(!S.settings.ttKey&&lsGet("ttkey"))S.settings.ttKey=lsGet("ttkey");if(S.settings.ttKey)lsSet("ttkey",S.settings.ttKey);if(S.settings._migrated){delete S.settings._migrated;lsSet("settings",S.settings)}}const c=lsGet("customers");if(Array.isArray(c))S.customers=c;const a=lsGet("appts");if(Array.isArray(a))S.appts=a;const d=lsGet("days");if(d&&typeof d==="object")S.days=d;const ev=lsGet("events");if(Array.isArray(ev))S.events=ev;const tm=lsGet("team");if(Array.isArray(tm))S.team=tm;const td=lsGet("todos");if(Array.isArray(td))S.todos=td}
function applyLoaded(k,v){if(k==="settings"){const m=migrate(v);if(!m.ttKey&&(S.settings.ttKey||lsGet("ttkey"))){m.ttKey=S.settings.ttKey||lsGet("ttkey");setTimeout(()=>persist("settings"),100)}if(m.ttKey)lsSet("ttkey",m.ttKey);const mig=m._migrated;delete m._migrated;S.settings=m;if(mig)setTimeout(()=>persist("settings"),50)}else if(k==="days")S.days=v&&typeof v==="object"&&!Array.isArray(v)?clone(v):{};else S[k]=Array.isArray(v)?clone(v):[]}
function setSaveState(){const el=$("#saveState");const busy=KEYS.some(k=>store.pending[k]||store.busy[k]);
  el.className="save"+(store.db?(busy?" busy":" cloud"):"");
  let txt="Gespeichert in diesem Browser";
  if(typeof GH!=="undefined"&&GH.on()){const pend=Object.keys(GH.dirty()).length;
    if(GH.busy||pend){txt=GH.err==="offline"?"Offline – wird später abgeglichen":"Wird abgeglichen …";el.className="save busy"}
    else if(GH.err){txt=GH.err==="offline"?"Offline – lokal gespeichert":"Abgleich-Fehler";el.className="save busy"}
    else{txt="Abgeglichen"+(GH.lastSync?" "+GH.lastSync.toLocaleTimeString("de-AT",{hour:"2-digit",minute:"2-digit"}):"");el.className="save cloud"}}
  el.querySelector("span").textContent=ui.refining?"Fahrzeiten werden berechnet …":txt;if(ui.refining)el.className="save busy";el.title=typeof GH!=="undefined"&&GH.err&&GH.err!=="offline"?GH.err:"Speicherstatus";}
function persist(k){
  if(k==="appts"){const lim=addDays(todayISO(),-400);S.appts=S.appts.filter(a=>!(["wahrgenommen","nicht"].includes(a.status)&&a.date<lim)&&!(a.type==="lunch"&&a.date<addDays(todayISO(),-60)))}
  if(k==="days"){const lim=addDays(todayISO(),-500);Object.keys(S.days).forEach(d=>{const c=S.days[d];if(d<lim||(!c.mode&&!c.overnight&&!c.dep&&!c.arr&&!c.live))delete S.days[d]})}
  lsSet(k,S[k]);GH.touch(k);
  if(!store.db){setSaveState();return}

/* Prüft, ob feste Termine erreichbar sind und die Rückkehr passt (ändert nichts) */
function checkDay(d){const st=S.settings;let es=dayEntries(d);if(!es.some(a=>a.type==="visit"))return{};

    const l=apptLoc(a);const arr=tm+(l?Math.max(0,travelIn(pos,a)-credit):0)+preB(a);if(l)credit=0;

/* Zeitachse eines Tages bei fester Reihenfolge.
   Feste Termine (fixiert, verschoben, persönlich, Kundenessen) behalten ihre Uhrzeit, Vorschläge laufen so früh wie möglich ab t0.
   Die eigene Mittagspause wird automatisch zwischen „frühestens“ und „spätestens“ gelegt, außer ein Kundenessen ersetzt sie.
   Liefert Abfahrt, Rückkehr, Reisezeit, Fahrminuten und Wartezeit. Wartezeit vor dem ersten festen Punkt zählt als „removable“:
   die fällt weg, wenn du einfach später losfährst. */
function timeline(d,seq,t0,o){

  const st=S.settings,LF=toMin(st.lunchFrom),LT=toMin(st.lunchTo),LM=st.lunchMin,LL=LT-LM,EV=toMin(st.earliestVisit);
  const s0=o.from||startLoc(d),e0=endLoc(d);

    let tr=l?(lastLocA?travelIn(pos,a):travelIn(s0,a)):0;
    if(lunchPending&&(i>0||o.from)){
      /* Mittagspause vor diesem Termin (am Ort, unterwegs oder bei Ankunft), wenn es Zeit ist oder sie danach zu spät käme */

      if(tm>=LF-20||estEnd+postB(a)>LL){
        const ls=up5(Math.max(tm,LF)),ready=Math.max(tm+tr,ls)+LM;
        if(ls<=LL&&(auto||ready+preB(a)<=a.startMin+2)){wait(ls-(tm+tr));lunch={start:ls,loc:null,pre:Math.max(0,Math.min(tr,ls-tm))};tm=ready-tr;lunchPending=false;anchored=true}
        else if(estEnd+postB(a)>LL&&(auto||Math.max(tm+tr,up5(tm))+LM+preB(a)<=a.startMin+2)){const lz=up5(tm);lunch={start:lz,loc:null,pre:Math.max(0,Math.min(tr,lz-tm))};tm=Math.max(tm+tr,lz)+LM-tr;lunchPending=false;anchored=true;lunchLate=true}

    if(dep===null)dep=start-preB(a)-tr;

  }

  const back=lastLocA&&hasXY(e0)?travelOut(lastLocA,e0):0;drive+=back;

/* Beste Abfahrtszeit: so spät wie möglich, ohne zusätzliche Wartezeit, ohne die Mindest-Reisezeit zu unterschreiten und mit Rückkehr bis „Ankunft spätestens“ */
function bestTimes(d,seq){

/* Zeiten anwenden: Vorschläge bekommen ihre Uhrzeit, die eigene Mittagspause wird neu gesetzt */

  seq.forEach((a,i)=>{if(isAutoV(a))a.startMin=r.times[i]});

/* Tag nach Änderungen (Ziehen, Bearbeiten, echte Fahrzeiten) neu takten */

  const lv=liveSplit(d,seq);
  if(lv){if(!lv.rest.length)return{dropId:null};const r=timeline(d,lv.rest,lv.L.min,{from:lv.L,noLunch:lv.noLunch});if(!r)return null;applyDay(d,lv.rest,r,lv.L.min);

const TT={

/* Streckenverläufe für die Karte (je Strecke einmal gespeichert) */
const GEO={d:null,load(){if(!this.d)this.d=lsGet("geo")||{}},k:(a,b)=>locKey(a)+">"+locKey(b),

/* Fahrzeiten für die geplanten Tage bei TomTom abfragen (Uhrzeit-genau, mit Verkehr) und Zeiten neu setzen */
async function refineRoutes(dates,quiet){

  if(ui.refining){if(!quiet)toast("Fahrzeiten werden gerade berechnet …");return}

  try{
    for(const d of dates){let es=dayEntries(d);if(!es.some(a=>a.type==="visit"))continue;
      for(let it=0;it<6;it++){let fetched=0,pos=startLoc(d),last=null;const L=liveOf(d);if(L){pos=L}
        for(const a of (L?es.filter(x=>x.startMin>=L.min):es)){const l=apptLoc(a);if(!l)continue;
          if(km(pos,l)<0.3){a.tt={from:locKey(pos),min:0,km:0,dep:a.startMin};pos=l;last=a;continue}
          const depMin=a.startMin-preB(a)-travelIn(pos,a);

/* Tag nach manueller Änderung neu takten; Vorschläge, die nicht mehr passen, werden entfernt (der Kunde bleibt fällig) */

const plannedDates=()=>[...new Set(S.appts.filter(a=>a.type==="visit"&&isOpen(a)&&a.date>=todayISO()).map(a=>a.date))].sort();

function capacity(){const st=S.settings,c=st.cap;const t=todayISO();let td=0,hd=0;

/* ---------- Automatische Tourenplanung ----------
   Pro Reisetag wird eine kompakte Tour gebaut:
   1. Feste Termine des Tages sind gesetzt. Gibt es keine, wird ein dringender Kunde als Mittelpunkt gewählt (mehrere Varianten werden probiert).
   2. Weitere Kunden werden dort eingefügt, wo sie den geringsten Umweg verursachen – also auf der Strecke oder in der Nähe der festen Termine.
   3. Fällige Kunden haben Vorrang, bald fällige werden nur mitgenommen, wenn sie praktisch auf dem Weg liegen.
   4. Die Variante mit dem besten Verhältnis aus Dringlichkeit, Fahrzeit und Wartezeit gewinnt. */
const PLAN={lambda:2.5,waitW:0.8,anchors:6,anchorGap:25,mass:0.3,massMin:25,det:[30,60,120]};
function planTours(){
  const st=S.settings;
  if(!hasXY(st.home)){toast("Bitte zuerst die Koordinaten von Zuhause in den Einstellungen eintragen.");ui.tab="settings";render();return}
  const t=todayISO();let start=t;if(nowMin()>=toMin(st.dayStart))start=addDays(t,1);
  const end=addDays(start,st.horizonWeeks*7);
  const isAuto=a=>a.date>=start&&!a.manual&&((a.type==="visit"&&a.status==="geplant")||a.type==="lunch");
  const replaced=S.appts.filter(a=>isAuto(a)&&a.type==="visit").length;
  const carry={};S.appts.filter(a=>isAuto(a)&&a.type==="visit"&&a.notes).forEach(a=>carry[a.customerId]=a.notes);
  S.appts=S.appts.filter(a=>!isAuto(a));
  let proj={},last={};
  S.customers.forEach(c=>{proj[c.id]=c.lastVisit&&isActive(c)?addDays(c.lastVisit,c.interval):null});
  S.appts.filter(a=>isOpen(a)&&a.date>=t).forEach(a=>{const c=custById(a.customerId);if(!c||!isActive(c))return;

async function replanToday(){const t=todayISO(),now=up5(nowMin()),st=S.settings;

  if(cur){const l=apptLoc(cur);L={min:up5(cur.startMin+cur.dur+postB(cur)),lat:l?l.lat:null,lng:l?l.lng:null};how="nach "+evLabel(cur).replace(/<[^>]+>/g,"")}
  if(!L||!hasXY(L)){let g=null;try{g=await new Promise((res,rej)=>{if(!navigator.geolocation)return rej();navigator.geolocation.getCurrentPosition(p=>res({lat:+p.coords.latitude.toFixed(5),lng:+p.coords.longitude.toFixed(5)}),rej,{timeout:10000,maximumAge:120000})})}catch(e){}
    const m0=fin?up5(fin.startMin+fin.dur+postB(fin)):now;

    else{const prev=es.filter(a=>apptLoc(a)&&a.startMin<now).pop();const l=prev?apptLoc(prev):startLoc(t);L={min:now,lat:l.lat,lng:l.lng};how=prev?"ab dem letzten Termin (Standort nicht verfügbar)":"ab Start (Standort nicht verfügbar)"}}
  L.at=Date.now();S.days[t]=Object.assign({},S.days[t],{live:L});persist("days");
  toast("Heute neu getaktet ab "+hm(L.min)+" "+how);

/* Kandidaten für einen Tag: fällige (u ≥ 1) und bald fällige (u < 0,4, nur bei kleinem Umweg) */
function candsFor(d,fixed,proj,last,lvl){
  const st=S.settings,used=new Set(fixed.map(a=>a.customerId).filter(Boolean)),out=[];
  const pf=[st.pullForward,Math.max(st.pullForward*3,21),Math.max(st.pullForward*5,35)][lvl];
  for(const c of S.customers){
    if(!isActive(c)||!hasXY(c)||used.has(c.id))continue;
    if(last[c.id]&&d<=last[c.id])continue;
    const p=proj[c.id];let u,early=false;
    if(!p)u=2.5;
    else{const od=diff(p,d);if(od>=0)u=1+Math.min(3,od/c.interval)+(od>21?(od-21)/7:0);else{const e=-od;if(e>Math.min(pf,Math.floor(c.interval*0.5)))continue;u=0.4/(1+e/20);early=true}}
    out.push({c,u,early})}
  return out}
function locBefore(seq,p,d){for(let i=p-1;i>=0;i--){const l=apptLoc(seq[i]);if(l)return l}return startLoc(d)}
function locFrom(seq,p,d){for(let i=p;i<seq.length;i++){const l=apptLoc(seq[i]);if(l)return l}return endLoc(d)}
const newVisit=(d,c)=>({id:uid(),type:"visit",customerId:c.id,date:d,startMin:0,dur:c.duration,status:"geplant",manual:false});
function daySeqSort(seq){/* feste Termine geben die Reihenfolge vor; Vorschläge stehen dazwischen */return seq}
/* Baut eine Tagestour durch billigstes Einfügen */
function buildDay(d,fixed,cands,anchor,lvl){
  const st=S.settings,ds=dayStartOf(d),de=dayEndOf(d);
  const seq=fixed.filter(a=>!isFlexV(a)).sort((a,b)=>a.startMin-b.startMin),flexs=fixed.filter(isFlexV);
  const base=seq.length?timeline(d,seq,ds):null;
  const lateLimit=Math.max(de+10,base?base.ret:0);
  const capNear=Math.max(st.maxVisits,st.maxVisitsNear||st.maxVisits);
  let count=seq.filter(a=>a.type==="visit"&&!a.lunchMeet).length;
  const added=[],taken=new Set();let gain=0;
  const dueDet=(PLAN.det||[60,90,150])[lvl],earlyDet=[st.clusterMin,st.clusterMin*2,Math.max(45,st.clusterMin*2)][lvl];
  const ins=(cand,p)=>{const a=newVisit(d,cand.c);seq.splice(p,0,a);added.push({c:cand.c,a});taken.add(cand.c.id);count++;gain+=cand.u};
  const fits=()=>{const r=timeline(d,seq,ds);return r&&r.ok&&!r.lunchLate&&r.ret<=lateLimit?r:null};
  /* Flextermine: fester Tag, Uhrzeit wählt der Planer – an der Stelle mit dem kleinsten Umweg einfügen */
  for(const fa of flexs){const c=custById(fa.customerId);const ps=[];
    for(let p=0;p<=seq.length;p++){const A=locBefore(seq,p,d),B=locFrom(seq,p,d);ps.push({p,det:c&&hasXY(c)?travel(A,c)+travel(c,B)-travel(A,B):0})}
    ps.sort((x,y)=>x.det-y.det);let ok=false;
    for(const {p} of ps){seq.splice(p,0,fa);const r=timeline(d,seq,ds);if(r&&r.ok&&!r.lunchLate){ok=true;break}seq.splice(p,1)}
    if(!ok)seq.push(fa)}
  if(anchor){let done=false;
    const ps=[];for(let p=0;p<=seq.length;p++){const A=locBefore(seq,p,d),B=locFrom(seq,p,d);ps.push({p,det:travel(A,anchor.c)+travel(anchor.c,B)-travel(A,B)})}
    ps.sort((x,y)=>x.det-y.det);
    for(const {p} of ps){ins(anchor,p);if(fits()){done=true;break}seq.splice(p,1);added.pop();taken.delete(anchor.c.id);count--;gain-=anchor.u}
    if(!done)return null}
  let cur=seq.length?timeline(d,seq,ds):null;
  for(let guard=0;guard<20;guard++){
    if(count>=capNear)break;
    if(cur&&count>=st.maxVisits&&cur.spanOk&&cur.waitEff<=30)break;
    const pairs=[];
    for(const cand of cands){if(taken.has(cand.c.id))continue;
      const lim=cand.early?earlyDet:dueDet;
      for(let p=0;p<=seq.length;p++){const A=locBefore(seq,p,d),B=locFrom(seq,p,d);
        const det=travel(A,cand.c)+travel(cand.c,B)-travel(A,B);if(det>lim)continue;
        pairs.push({cand,p,sc:cand.u-PLAN.lambda*det/60})}}
    if(!pairs.length)break;
    pairs.sort((x,y)=>y.sc-x.sc);
    let placed=false;
    for(let k=0;k<pairs.length&&k<60;k++){const {cand,p}=pairs[k];
      if(cand.early&&count>=st.maxVisits&&cur&&cur.spanOk&&cur.waitEff<=30)continue;
      ins(cand,p);const r=fits();
      if(r){cur=r;placed=true;break}
      seq.splice(p,1);added.pop();taken.delete(cand.c.id);count--;gain-=cand.u}
    if(!placed)break;
  }
  if(!added.length&&!fixed.some(a=>a.type==="visit"))return null;
  improveOrder(d,seq,fits);
  const r=timeline(d,seq,ds);if(!r||!r.ok)return null;
  const score=gain-PLAN.lambda*r.drive/60-PLAN.waitW*r.waitEff/60-(r.spanOk?0:2.5);
  return{seq,added,r,score}}
/* Reihenfolge verbessern: jeden Vorschlag an die Stelle mit der kürzesten Gesamtfahrt verschieben (feste Termine bleiben) */
function routeDrive(d,seq){let pos=startLoc(d),m=0;for(const a of seq){const l=apptLoc(a);if(l){m+=travel(pos,l);pos=l}}return m+travel(pos,endLoc(d))}
function improveOrder(d,seq,fits){
  for(let round=0;round<3;round++){let better=false;
    for(let i=0;i<seq.length;i++){if(!isAutoV(seq[i]))continue;
      const base=routeDrive(d,seq);const a=seq.splice(i,1)[0];let bestP=i,bestM=base;
      for(let p=0;p<=seq.length;p++){if(p===i)continue;seq.splice(p,0,a);const m=routeDrive(d,seq);if(m<bestM-2&&fits()){bestM=m;bestP=p}seq.splice(p,1)}
      seq.splice(bestP,0,a);if(bestP!==i)better=true}
    if(!better)break}
}
/* Mittelpunkte für Tage ohne feste Termine: dringendste Kunden, räumlich verschieden */
function pickAnchors(d,cands){
  const s0=startLoc(d),e0=endLoc(d),night=s0!==S.settings.home||e0!==S.settings.home;
  const dueC=cands.filter(x=>!x.early);
  const due=dueC.map(x=>({x,k:x.u+PLAN.mass*dueC.reduce((s,y)=>s+(y!==x&&travel(x.c,y.c)<=PLAN.massMin?y.u:0),0)-(night?PLAN.lambda*(travel(s0,x.c)+travel(x.c,e0)-travel(s0,e0))/60:0)})).sort((a,b)=>b.k-a.k);
  const out=[];for(const {x} of due){if(out.every(o=>travel(o.c,x.c)>=PLAN.anchorGap))out.push(x);if(out.length>=PLAN.anchors)break}
  return out}
function planDay(d,fixed,proj,last){
  const hasAnchor=fixed.some(a=>apptLoc(a));let best=null;
  for(const lvl of [0,1,2]){
    const cands=candsFor(d,fixed,proj,last,lvl);
    const anchors=hasAnchor?[null]:pickAnchors(d,cands);if(!anchors.length)anchors.push(null);
    for(const an of anchors){const r=buildDay(d,fixed,cands,an,lvl);if(r&&(!best||r.score>best.score))best=r}
    if(best&&best.r.spanOk&&best.r.waitEff<=30)break;
  }
  return best}

function parseMecard(t){if(!/^MECARD:/i.test(t))return null;const p={id:uid(),name:"",role:"",phone:"",mobile:"",email:"",org:"",note:""};
  t.slice(7).split(/;(?=[A-Z\-]+:)/i).forEach(x=>{const i=x.indexOf(":");const k=x.slice(0,i).toUpperCase(),v=x.slice(i+1).replace(/;+$/,"");if(k==="N")p.name=v.split(",").reverse().join(" ").trim();else if(k==="TEL"){if(!p.mobile)p.mobile=v;else p.phone=v}else if(k==="EMAIL")p.email=v;else if(k==="ORG")p.org=v;else if(k==="TITLE")p.role=v;else if(k==="NOTE")p.note=v});return p.name?p:null}

async function scanQr(){let stream=null,raf=0,stop=false;
  const w=modal(`<div class="hd"><h2>Visitenkarte scannen</h2><button class="x" data-close aria-label="Schließen">×</button></div>
  <div class="scanbox"><video id="qv" playsinline muted></video><div class="scanframe"></div></div><p class="muted small" id="qs" style="margin:0;text-align:center">Kamera wird gestartet …</p>
  <div class="row" style="justify-content:center"><label class="btn sm">Foto eines QR-Codes wählen<input type="file" id="qf" accept="image/*" hidden></label></div>`);
  const end=()=>{stop=true;cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop())};
  new MutationObserver((_,o)=>{if(!document.body.contains(w)){end();o.disconnect()}}).observe(document.body,{childList:true});
  const decode=(src,W,H)=>{const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(src,0,0,W,H);const d=x.getImageData(0,0,W,H);return jsQR(d.data,W,H,{inversionAttempts:"attemptBoth"})};
  $("#qf",w).addEventListener("change",async ev=>{const f=ev.target.files[0];if(!f)return;try{await loadJsQR();const im=new Image();im.onload=()=>{const k=Math.min(1,1200/Math.max(im.width,im.height));const r=decode(im,Math.round(im.width*k),Math.round(im.height*k));if(r){end();closeModal();qrToContact(r.data)}else $("#qs",w).textContent="Kein QR-Code im Foto erkannt."};im.src=URL.createObjectURL(f)}catch(e){$("#qs",w).textContent=e.message}});
  try{await loadJsQR();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});if(stop){end();return}
    const v=$("#qv",w);v.srcObject=stream;await v.play();$("#qs",w).textContent="QR-Code ins Bild halten";
    const tick=()=>{if(stop)return;if(v.videoWidth){const k=Math.min(1,640/v.videoWidth);const r=decode(v,Math.round(v.videoWidth*k),Math.round(v.videoHeight*k));if(r&&r.data){end();closeModal();qrToContact(r.data);return}}raf=requestAnimationFrame(tick)};tick()}
  catch(e){const q=$("#qs",w);if(q)q.textContent=(e&&e.name==="NotAllowedError"?"Kamera nicht erlaubt – ":"Kamera nicht verfügbar – ")+"du kannst ein Foto des QR-Codes wählen."}}

function kwOf(x){const d=pISO(x);d.setDate(d.getDate()+3);const j=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-j)/864e5-3+((j.getDay()+6)%7))/7)}
function mapWeekDays(){const out=[];for(let i=0;i<7;i++){const d=addDays(ui.mapWeek,i);if(i<5||daySummary(d))out.push(d)}return out}
function setMapWeek(m,days){ui.mapWeek=m;ui.mapDays=new Set(days||mapWeekDays().filter(d=>daySummary(d)))}
function routeDays(){if(!ui.mapWeek)return[];return mapWeekDays().filter(d=>ui.mapDays&&ui.mapDays.has(d)&&daySummary(d))}
function mapToggles(){

    return`<button class="dtg ${on?"on":""}" ${s?`data-mtog="${d}"`:"disabled"} aria-pressed="${on}" title="${esc(s?title:off)}" style="--c:${col}"><span class="sw2"></span><b>${DOW[dow(d)]}</b><small>${d.slice(8,10)}.${d.slice(5,7)}.</small></button>`}).join("")}

/* --- Karte (Leaflet mit TomTom- oder OpenStreetMap-Kacheln) --- */
const DAYCOL={1:"#1f6fd1",2:"#d23c2f",3:"#1d9a5b",4:"#c98a00",5:"#7b55c7",6:"#0f8f95",0:"#b23c8a"};
const mapView={
  map:null,fitted:false,view:null,markers:{},
  attach(box){const el=$("#lmap",box);
    if(typeof L==="undefined"){el.innerHTML='<p class="muted" style="padding:20px">Die Kartenbibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen.</p>';return}
    if(this.map){this.map.remove();this.map=null}
    const touch=window.matchMedia&&matchMedia("(pointer:coarse)").matches;
    this.map=L.map(el,{zoomControl:false,attributionControl:true,dragging:!touch,tap:false});
    if(touch){/* Ein Finger scrollt die Seite, zwei Finger verschieben und zoomen die Karte */
      const hint=document.createElement("div");hint.className="maphint";hint.textContent="Zum Verschieben der Karte zwei Finger verwenden";box.appendChild(hint);let ht;
      el.addEventListener("touchmove",e=>{if(e.touches.length===1){hint.classList.add("show");clearTimeout(ht);ht=setTimeout(()=>hint.classList.remove("show"),1200)}else hint.classList.remove("show")},{passive:true});}L.control.zoom({position:"topright"}).addTo(this.map);
    const k=TT.key();
    (k?L.tileLayer("https://api.tomtom.com/map/1/tile/basic/main/{z}/{x}/{y}.png?tileSize=256&key="+encodeURIComponent(k),{maxZoom:20,attribution:"© TomTom · © OpenStreetMap-Mitwirkende"})
      :L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap-Mitwirkende"})).addTo(this.map);
    this.routes=L.layerGroup().addTo(this.map);this.layer=L.layerGroup().addTo(this.map);
    this.drawMarkers();this.drawRoutes();
    if(this.fitted&&this.view)this.map.setView(this.view.c,this.view.z);else this.fit();
    this.map.on("moveend",()=>{this.view={c:this.map.getCenter(),z:this.map.getZoom()}});
    setTimeout(()=>this.map&&this.map.invalidateSize(),60)},
  fit(){if(!this.map)return;const p=S.customers.filter(c=>(isActive(c)?ui.showActive:ui.showInactive)&&hasXY(c)).map(c=>[c.lat,c.lng]);if(hasXY(S.settings.home))p.push([S.settings.home.lat,S.settings.home.lng]);
    const rd=routeDays();if(rd.length){const q=[];rd.forEach(d=>{[startLoc(d),...dayEntries(d).map(apptLoc).filter(Boolean),endLoc(d)].filter(hasXY).forEach(x=>q.push([x.lat,x.lng]))});if(q.length){this.map.fitBounds(q,{padding:[40,40]});this.fitted=true;return}}
    if(p.length)this.map.fitBounds(p,{padding:[30,30]});else this.map.setView([47.25,11.4],8);this.fitted=true},
  col(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()},
  popHtml(c){const n=nextAppt(c.id);return`<div class="pop"><h3>${esc(c.name)}</h3><div class="muted">${esc([c.street,[c.zip,c.city].filter(Boolean).join(" ")].filter(Boolean).join(", "))}</div>
    <div class="row" style="gap:6px"><span class="pill p-${dueClass(c)}">${dueText(c)}</span>${n?`<span class="pill p-plan">${n.status==="fixiert"?"fixiert":"geplant"} ${fmtD(n.date)} ${hm(n.startMin)}</span>`:""}</div>
    ${mainContact(c)?`<div class="small" style="margin-top:4px">${esc(mainContact(c).role||"Ansprechpartner")}: ${esc(mainContact(c).name)}</div>`:""}
    <div class="muted" style="font-size:12.5px;margin-top:4px">${isActive(c)?"alle "+c.interval+" Tage · "+c.duration+" min":"kein Besuchsintervall"}${hasXY(S.settings.home)?" · ca. "+travel(S.settings.home,c)+" min ab Zuhause":""}</div>
    <div class="row"><button class="btn sm pri" data-cust="${c.id}">Details</button><a class="btn sm" href="${gmapsPlace(c)}" target="_blank" rel="noopener">Google Maps</a></div></div>`},
  drawMarkers(){if(!this.map)return;this.layer.clearLayers();this.markers={};
    const colOf={over:this.col("--over"),soon:this.col("--soon"),ok:this.col("--ok"),none:this.col("--inact")},ring=this.col("--accent"),srf=this.col("--surface");
    const list=S.customers.filter(c=>hasXY(c)&&(isActive(c)?ui.showActive:ui.showInactive)).sort((a,b)=>(isActive(a)?1:0)-(isActive(b)?1:0));
    list.forEach(c=>{const planned=!!nextAppt(c.id),act=isActive(c);
      const m=L.circleMarker([c.lat,c.lng],{radius:c.id===ui.sel?9:act?6.5:5,color:planned?ring:srf,weight:planned?3:1.5,fillColor:colOf[dueClass(c)],fillOpacity:act?1:.85});
      m.bindPopup(this.popHtml(c),{maxWidth:260,minWidth:220});m.bindTooltip(esc(c.name),{direction:"top",offset:[0,-6]});
      m.on("click",()=>{ui.sel=c.id});m.addTo(this.layer);this.markers[c.id]=m});
    const h=S.settings.home;if(hasXY(h))L.marker([h.lat,h.lng],{icon:L.divIcon({className:"homeic",html:"<span></span>",iconSize:[18,18]}),zIndexOffset:1000}).bindTooltip(esc(h.label||"Zuhause")).addTo(this.layer);
    S.appts.filter(a=>isHotel(a)&&a.date>=todayISO()).forEach(a=>L.marker([a.loc.lat,a.loc.lng],{icon:L.divIcon({className:"hotelic",html:"H",iconSize:[18,18]})}).bindTooltip(esc(a.title)+" · "+fmtD(a.date)).addTo(this.layer))},
  drawRoutes(){if(!this.map)return;this.routes.clearLayers();const leg=$("#rlegend");const rd=routeDays();
    const sl=$("#mapbox .legend");if(sl)sl.hidden=!!rd.length;if(leg){leg.hidden=!rd.length;leg.innerHTML=rd.map(d=>{const s=daySummary(d);return`<span><i style="background:${DAYCOL[dow(d)]}"></i>${fmtD(d)} · ${s.n} Besuche · ${s.km} km · ${hm(s.min)} h${s.real?"":" (geschätzt)"}</span>`}).join("")+`<span id="geonote" class="geonote" ${this.geoState?"":"hidden"}>${esc(this.geoState)}</span>`+(TT.key()?"":`<span class="geonote">Ohne TomTom-Schlüssel nur Luftlinien</span>`)}
    const missing=[];
    rd.forEach(d=>{const color=DAYCOL[dow(d)];const seq=[startLoc(d),...dayEntries(d).map(apptLoc).filter(Boolean),endLoc(d)].filter(hasXY);
      for(let i=0;i<seq.length-1;i++){if(km(seq[i],seq[i+1])>=0.3&&!GEO.get(seq[i],seq[i+1]))missing.push([seq[i],seq[i+1]])}
      for(let i=0;i<seq.length-1;i++){const a=seq[i],b=seq[i+1];if(km(a,b)<0.3)continue;const g=GEO.get(a,b);
        L.polyline(g||[[a.lat,a.lng],[b.lat,b.lng]],{color,weight:g?5:3,opacity:.85,dashArray:g?null:"6 7"}).addTo(this.routes)}
      dayEntries(d).filter(a=>a.type==="visit").forEach((a,i)=>{const l=apptLoc(a);if(!l)return;
        L.marker([l.lat,l.lng],{icon:L.divIcon({className:"numic",html:`<span style="background:${color}">${i+1}</span>`,iconSize:[22,22],iconAnchor:[-2,24]}),interactive:true,zIndexOffset:500,keyboard:false}).bindPopup(`<b>${evLabel(a)}</b><br>${fmtD(d)} · ${hm(a.startMin)}–${hm(a.startMin+a.dur)}`,{className:"numpop",closeButton:false,offset:[13,-17],autoPanPadding:[20,20]}).addTo(this.routes)})});
    if(missing.length)this.fetchGeo(missing)},
  draw(){if(this.map){this.drawMarkers();this.drawRoutes()}},
  /* Streckenverlauf nach Straßen nachladen, wenn er auf diesem Gerät noch fehlt (z. B. am iPhone nach dem Abgleich) */
  async fetchGeo(legs){if(this.geoBusy||!TT.key()||!legs.length)return;this.geoBusy=true;let n=0,fail=0;this.geoErr=null;

function readCustForm(w){const c=w.dataset.isnew?{id:w.dataset.cid}:custById(w.dataset.cid);const v=id=>$("#"+id,w).value.trim();
  c.name=v("c-name")||"Ohne Namen";c.kdnr=v("c-kdnr");c.type=v("c-type");c.parentId=v("c-parent")||null;c.street=v("c-street");c.zip=v("c-zip");c.city=v("c-city");
  const la=num(v("c-lat")),ln=num(v("c-lng"));if(w.dataset.xyChanged&&(la!==c.lat||ln!==c.lng)){c.geo=la!=null?"manuell":null;c.geoAddr=null}c.lat=la;c.lng=ln;
  if(w.dataset.addrChanged&&!w.dataset.xyChanged){c.lat=null;c.lng=null;c.geo=null;c.geoAddr=null}
  const iv=num(v("c-interval"));c.interval=iv&&iv>0?Math.round(iv):null;c.active=true;
  c.duration=Math.max(5,num(v("c-duration"))||S.settings.defDuration);
  c.lastVisit=v("c-last")||null;c.phone=v("c-phone");c.email=v("c-email");c.notes=$("#c-notes",w).value;
  c.contacts=$$(".pcard",w).map(r=>({id:r.dataset.pid,name:$(".p-name",r).value.trim(),role:$(".p-role",r).value.trim(),phone:$(".p-phone",r).value.trim(),email:$(".p-email",r).value.trim(),note:$(".p-note",r).value.trim()})).filter(p=>p.name||p.phone||p.email);
  delete c.contact;
  c.potential=$$(".potr",w).map(r=>{const share={};$$(".pot-s",r).forEach(i=>{const x=num(i.value);if(x!=null)share[i.dataset.y]=Math.max(0,Math.min(100,x))});
    return{g:r.dataset.g,pot:num($(".pot-v",r).value),share}}).filter(p=>p.pot!=null||Object.keys(p.share).length);
  const wr=$$(".whrow",w);c.wholesalers=wr.map(r=>({id:$(".w-id",r).value,main:$(".w-main",r).checked,note:$(".w-note",r).value.trim()})).filter(x=>x.id&&x.id!==c.id);
  if(c.wholesalers.length&&!c.wholesalers.some(x=>x.main))c.wholesalers[0].main=true;
  c.docs=$$(".docr",w).map(r=>({d:r.dataset.d,date:$(".doc-date",r).value})).filter(x=>x.date);
  return c}

document.addEventListener("change",e=>{
  if(ui.tab==="events"&&ui.evSel&&ui.evMode==="edit"&&!e.target.closest("#modal")&&(e.target.dataset.ev||e.target.dataset.pres||e.target.dataset.pfrom||e.target.dataset.pto||e.target.dataset.evchip)){evField(e.target);return}
  const t=e.target;const s=S.settings;
  if(t.id==="s-theme"){document.documentElement.dataset.theme=t.value;try{localStorage.setItem("tp.theme",t.value)}catch(err){}const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=getComputedStyle(document.documentElement).getPropertyValue("--surface").trim()||"#121e2a";return}
  if(t.dataset.k){const k=t.dataset.k;s[k]=t.type==="number"?(num(t.value)??DEF[k]):t.value.trim();if(k==="ttKey")lsSet("ttkey",s[k]);save("settings");if(["vacationDays","ttKey","briefMin","travelPct","overhead","freeDays"].includes(k)){if(k==="ttKey")mapView.fitted=false;render(true)}return}
  if(t.dataset.wd!==undefined){const d=+t.dataset.wd;s.travelDays=t.checked?[...new Set([...s.travelDays,d])]:s.travelDays.filter(x=>x!==d);save("settings");render(true);return}
  if(t.dataset.cap){const k=t.dataset.cap;s.cap[k]=t.type==="checkbox"?t.checked:(num(t.value)??DEF.cap[k]);save("settings");render(true);return}
  if(t.id&&t.id.startsWith("h-")){const h=s.home;
    if(t.id==="h-paste"){const p=parseCoords(t.value);if(p){h.lat=p.lat;h.lng=p.lng;t.value="";save("settings");render(true);toast("Koordinaten übernommen")}else toast("Keine Koordinaten erkannt");return}
    if(t.id==="h-lat"||t.id==="h-lng")h[t.id.slice(2)]=num(t.value);else h[t.id.slice(2)]=t.value;
    if(t.id==="h-address"&&t.value.trim()&&TT.key()){save("settings");geocode(null,true);return}
    save("settings");const a=$("#h-search");if(a)a.href=gmapsPlace({street:h.address});return}
  if(t.id==="dueX"){s.dueX=Math.max(1,num(t.value)||14);save("settings");render(true);return}
  if(t.id==="showActive"){ui.showActive=t.checked;try{localStorage.setItem("tp.showActive",t.checked?"1":"0")}catch(x){}mapView.drawMarkers();return}
  if(t.id==="showInactive"){ui.showInactive=t.checked;try{localStorage.setItem("tp.showInactive",t.checked?"1":"0")}catch(x){}mapView.drawMarkers();return}
  if(t.id==="cfilter"){ui.custFilter=t.value;render(true);return}
  if(t.id==="csort"){ui.sort=t.value;render(true);return}
  if(t.id==="ctype"){ui.typeFilter=t.value;render(true);return}
  if(t.id==="creg"){ui.regFilter=t.value;try{localStorage.setItem("tp.reg",t.value)}catch(e){}render(true);return}
  if(t.id==="cdoc"){ui.docFilter=t.value;render(true);return}
  if(t.dataset.list){S.settings[t.dataset.list]=t.value.split("\n").map(x=>x.trim()).filter(Boolean);save("settings");return}
});
document.addEventListener("input",e=>{if(e.target.id==="csearch"){ui.search=e.target.value;clearTimeout(ui.st);ui.st=setTimeout(()=>{const p=e.target.selectionStart;render(true);const i=$("#csearch");if(i){i.focus();i.setSelectionRange(p,p)}},180)}});
function parseCoords(s){if(!s)return null;s=String(s);
  let m=s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||s.match(/[?&](?:q|query|ll)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/)||s.match(/(-?\d{1,2}\.\d+)\s*[,;\s]\s*(-?\d{1,3}\.\d+)/)||s.match(/(-?\d{1,2},\d+)\s*[;\s]\s*(-?\d{1,3},\d+)/);
  if(!m)return null;const lat=num(m[1]),lng=num(m[2]);if(lat==null||lng==null||Math.abs(lat)>90||Math.abs(lng)>180)return null;return{lat,lng}}

/* TomTom-Schlüssel prüfen: jeden Dienst einzeln testen und das Ergebnis im Klartext zeigen */
async function ttDiag(){
  const k=encodeURIComponent(TT.key()),raw=String(S.settings.ttKey||"");
  const tests=[
    ["Adresssuche (Search API)",`https://api.tomtom.com/search/2/geocode/Innsbruck.json?key=${k}&limit=1`],
    ["Fahrzeiten (Routing API)",`https://api.tomtom.com/routing/1/calculateRoute/47.2692,11.4041:47.4125,9.7417/json?key=${k}&traffic=true`],
    ["Kartenhintergrund (Map Display API)",`https://api.tomtom.com/map/1/tile/basic/main/8/136/90.png?tileSize=256&key=${k}`]];
  const w=modal(`<div class="hd"><h2>TomTom-Schlüssel prüfen</h2><button class="x" data-close aria-label="Schließen">×</button></div><div id="ttres" class="muted">Teste …</div>`);
  const rows=[];
  for(const [name,url] of tests){let st="",ok=false,msg="";
    if(url.includes("/map/1/tile/")){ok=await new Promise(res=>{const im=new Image();im.onload=()=>res(true);im.onerror=()=>res(false);im.src=url;setTimeout(()=>res(false),10000)});st=ok?200:"403";if(!ok)msg="Kachel wurde nicht geladen – Map Display API vermutlich nicht freigeschaltet.";}
    else try{const res=await fetch(url);st=res.status;ok=res.ok;if(!ok){try{const t=await res.text();msg=(t.match(/"(?:errorText|detailedError|message)"\s*:\s*"([^"]+)"/)||[])[1]||t.slice(0,140)}catch(e){}}}
    catch(e){st="keine Verbindung";msg="Der Browser hat die Anfrage blockiert. Häufigste Ursache: Domain-Beschränkung beim Schlüssel, während die App als lokale Datei geöffnet ist."}
    rows.push(`<tr><td>${esc(name)}</td><td>${ok?'<span class="pill p-ok">funktioniert</span>':`<span class="pill p-over">Fehler ${esc(String(st))}</span>`}</td><td class="muted small">${esc(msg)}</td></tr>`);
    if(!$("#ttres",w))return;$("#ttres",w).innerHTML=`<table class="maptbl" style="min-width:0"><tbody>${rows.join("")}</tbody></table>`}
  const len=TT.key().length;
  $("#ttres",w).insertAdjacentHTML("beforeend",`<p class="hint">Schlüssellänge: ${len} Zeichen${len!==32?" – TomTom-Schlüssel haben normalerweise 32 Zeichen. Bitte prüfen, ob der ganze Schlüssel kopiert wurde (nicht der Name oder die Key-ID).":""}${raw.replace(/[^A-Za-z0-9]/g,"")!==raw.trim()?" Leer- oder Sonderzeichen wurden entfernt.":""}</p>
  <p class="hint">Fehler 403: Dienst für diesen Schlüssel nicht freigeschaltet, Domain-Beschränkung aktiv oder Schlüssel noch nicht aktiv (neue Schlüssel brauchen manchmal einige Minuten). Fehler 401/400: Schlüssel falsch kopiert.</p>`)}
